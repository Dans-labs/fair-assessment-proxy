[logging]
log_file = "@format {env[BASE_DIR]}/logs/tool-registry.log"
log_level = "INFO"
use_detailed_format = false

[database]
host = "postgres"
port = 5432
name = "fairdb"
user = "fairman"
password = "changeme"

[service]
name = "Fair Proxy"
listen_port = 8181
bind_address = "127.0.0.1"
api_prefix = "/api/v1"
admin_auth_key = "changeme"
egi_env = "development" # Set to "production" or "development" or "demo"

