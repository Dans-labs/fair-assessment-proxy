services:
  fair-assessment-proxy:
    image: ghcr.io/dans-labs/fair-assessment-proxy:latest
    container_name: fair-assessment-proxy
    # ports:
    #   - "${FAIR_PROXY_PORT:-8080}:8080"
    environment:
      # Internal Docker URL, not localhost
      FUJI_BASE_URL: "http://fuji:1071/fuji/api/v1"

      # Basic auth used by the proxy when calling F-UJI
      FUJI_USERNAME: ${FUJI_USERNAME}
      FUJI_PASSWORD: ${FUJI_PASSWORD}

      # FAIR Champion / FAIR Core Tests
      CHAMPION_BASE_URL: "http://fair-champion:4567/champion"
      FAIR_CORE_TESTS_BASE_URL: "http://fair-core-tests:8282/tests"

      # Optional API settings
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
    depends_on:
      fuji:
        condition: service_started
      fair-champion:
        condition: service_started
      fair-core-tests:
        condition: service_started
      postgres:
        condition: service_healthy

    networks:
      - fair-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fair_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fair-net

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng-config/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - fair-net

  fuji:
    image: ghcr.io/pangaea-data-publisher/fuji:latest
    container_name: fuji
    # ports:
    #   - "1071:1071"
    volumes:
      # Override F-UJI users.py so you control basic auth credentials
      - ./fuji-config/users.py:/usr/src/app/fuji_server/config/users.py:ro
    environment:
      ENABLE_CORS: "true"
      FUJI_USERNAME: "${FUJI_USERNAME}"
      FUJI_PASSWORD: "${FUJI_PASSWORD}"
    networks:
      - fair-net

  fair-champion:
    image: markw/fair-champion:1.1.11
    container_name: fair-champion
    # ports:
    #   - "8383:4567"
    environment:
      RACK_ENV: "production"

      # Champion should use the local FAIR Core Tests container.
      TEST_HOST: "http://fair-core-tests:8282/tests"

      # Public URL used by Champion when generating links.
      CHAMP_HOST: "http://localhost:8383/champion"
      CHAMPION_HOST: "http://localhost:8383/champion"

      # Keep public defaults unless you also deploy the FDP index/proxy locally.
      FDPINDEX_SPARQL: "https://tools.ostrails.eu/repositories/fdpindex-fdp"
      FDPINDEXPROXY: "https://tools.ostrails.eu/fdp-index-proxy/proxy"
    depends_on:
      - fair-core-tests
    networks:
      - fair-net

  fair-core-tests:
    image: markw/fair-core-tests:0.5.5
    container_name: fair-core-tests
    # ports:
    #   - "8282:8282"
    environment:
      SEARXNG_URL: http://searxng:8080/search
      SEARXNG_OPEN_TIMEOUT: "5"
      SEARXNG_READ_TIMEOUT: "20"
      TEST_PROTOCOL: "http"
      TEST_HOST: "fair-core-tests:8282"
      TEST_PATH: "/tests/"
      FAIRSHARING_KEY: "your_fairsharing_key_here"
    depends_on:
      - searxng
    networks:
      - fair-net
  
  tika:
    image: apache/tika:3.3.0.0
    container_name: evaluator-tika
    restart: always
    networks:
      - fair-net

volumes:
  fair_postgres_data:

networks:
  fair-net:
    driver: bridge
