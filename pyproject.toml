    "fastapi>=0.128.0",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.3",
    "pyjwt>=2.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.40.0",
]

